contentType: chart
version: 1
name: "Hospital Rating Distribution"
slug: hospital-rating-distribution
spaceSlug: hospital-management
tableName: hospitals
metricQuery:
  exploreName: hospitals
  metrics:
    - hospitals_count
  dimensions:
    - hospitals_hospital_overall_rating
  tableCalculations: []
  filters: {}
  sorts:
    - fieldId: hospitals_hospital_overall_rating
      descending: false
  limit: 500
chartConfig:
  type: cartesian
  config:
    layout:
      xField: hospitals_hospital_overall_rating
      yField:
        - hospitals_count
    eChartsConfig:
      series:
        - type: bar
          encode:
            xRef:
              field: hospitals_hospital_overall_rating
            yRef:
              field: hospitals_count
          label:
            show: true
            position: "top"
      xAxis:
        - name: "Hospital Rating"
      yAxis:
        - name: "Number of Hospitals"
